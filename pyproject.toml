[project]
name = "sports-shorts-command-center"
version = "0.1.0"
description = "Zero-cost, human-in-the-loop sports shorts generation pipeline"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "google-genai>=2.16.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
