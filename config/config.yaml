app:
  name: "Sports Shorts Command Center"
  env: "development"
  log_level: "INFO"
  database_path: "data/sports_shorts.db"
  cache_dir: "data/cache"
  assets_dir: "data/assets"
  renders_dir: "data/renders"

llm:
  fallback_order:
    - "gemini"
    - "groq"
    - "openrouter"
    - "ollama"
  cache_enabled: true
  timeout_seconds: 30.0
  max_retries_per_provider: 2
  providers:
    gemini:
      model: "gemini-2.5-flash"
      daily_request_limit: 1500
      rpm_limit: 15
    groq:
      model: "llama-3.3-70b-versatile"
      base_url: "https://api.groq.com/openai/v1"
      daily_request_limit: 14400
      rpm_limit: 30
    openrouter:
      model: "google/gemini-2.0-flash-exp:free"
      base_url: "https://openrouter.ai/api/v1"
      daily_request_limit: 200
      rpm_limit: 10
    ollama:
      model: "llama3.2:latest"
      base_url: "http://localhost:11434"
      daily_request_limit: 100000
      rpm_limit: 60

pipeline:
  max_story_age_hours: 24
  candidate_stories_count: 12
  min_verified_facts: 3
  target_duration_seconds: 35
  min_words: 80
  max_words: 120
  fuzzy_evidence_threshold: 0.85
  max_script_retries: 3
